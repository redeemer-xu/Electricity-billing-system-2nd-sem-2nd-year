<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Billing System - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h1 class="text-center mb-4">Login Page</h1>
    
    <form id="loginForm">
      <div class="mb-3">
        <label for="user" class="form-label">Username</label>
        <input type="text" id="user" name="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="pass" class="form-label">Password</label>
        <input type="password" id="pass" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault(); // stop default form submission

  let username = document.getElementById("user").value.trim();
  let password = document.getElementById("pass").value.trim();

  // Demo credentials (replace with real authentication later)
  const validUser = "admin";
  const validPass = "1234";

  if (username === validUser && password === validPass) {
    // Redirect to dashboard
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid username or password. Please try again.");
  }
});
</script>

</body>
</html>
