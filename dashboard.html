<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Billing Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css"> <!-- background image -->
</head>
<body>

<div class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar Form -->
    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>Billing Input</h4>
        </div>
        <div class="card-body">
          <form id="billingForm">
            <div class="mb-3">
              <label class="form-label">Consumer Name</label>
              <input type="text" id="consumerName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Units Consumed (kWh)</label>
              <input type="number" id="units" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tariff Category</label>
              <select id="tariff" class="form-select">
                <option value="residential">Residential</option>
                <option value="commercial">Commercial</option>
                <option value="industrial">Industrial</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Add Bill</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Dashboard Table -->
    <div class="col-md-9">
      <div class="card shadow">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <h4>Billing Dashboard</h4>
          <!-- Button to show consumers -->
          <button class="btn btn-info btn-sm" onclick="showConsumers()">Show All Consumers</button>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead class="table-primary">
              <tr>
                <th>Consumer</th>
                <th>Units</th>
                <th>Category</th>
                <th>Total Bill</th>
              </tr>
            </thead>
            <tbody id="billTable"></tbody>
          </table>

          <!-- Consumers list (hidden by default) -->
          <div id="consumerList" class="mt-4" style="display:none;">
            <h5>All Consumers</h5>
            <ul class="list-group" id="consumersUl"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let consumers = []; // store consumer names

document.getElementById("billingForm").addEventListener("submit", function(e) {
  e.preventDefault();
  addBill();
});

function addBill() {
  let consumer = document.getElementById("consumerName").value;
  let units = parseFloat(document.getElementById("units").value);
  let tariff = document.getElementById("tariff").value;

  // Simple rate logic
  let rate = (tariff === "residential") ? 10 : (tariff === "commercial") ? 15 : 20;
  let fixedCharge = (tariff === "residential") ? 50 : (tariff === "commercial") ? 100 : 200;
  let baseAmount = units * rate;
  let tax = baseAmount * 0.12;
  let total = baseAmount + fixedCharge + tax;

  // Add row to table
  let table = document.getElementById("billTable");
  let row = table.insertRow();
  row.innerHTML = `
    <td>${consumer}</td>
    <td>${units}</td>
    <td>${tariff}</td>
    <td><strong>₱${total.toFixed(2)}</strong></td>
  `;

  // Save consumer name (avoid duplicates)
  if (!consumers.includes(consumer)) {
    consumers.push(consumer);
  }

  document.getElementById("billingForm").reset();
}

function showConsumers() {
  let list = document.getElementById("consumersUl");
  list.innerHTML = ""; // clear old list
  consumers.forEach((c, i) => {
    let li = document.createElement("li");
    li.className = "list-group-item";
    li.textContent = (i+1) + ". " + c;
    list.appendChild(li);
  });
  document.getElementById("consumerList").style.display = "block";
}
</script>

</body>
</html>
