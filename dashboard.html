<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Billing Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid mt-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>Billing Input</h4>
        </div>
        <div class="card-body">
          <form id="billingForm">
            <div class="mb-3">
              <label class="form-label">Consumer Name</label>
              <input type="text" class="form-control" id="consumerName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Units Consumed (kWh)</label>
              <input type="number" class="form-control" id="units" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tariff Category</label>
              <select class="form-select" id="tariff">
                <option value="residential">Residential</option>
                <option value="commercial">Commercial</option>
                <option value="industrial">Industrial</option>
              </select>
            </div>
            <button type="button" class="btn btn-success w-100" onclick="calculateBill()">Add Bill</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Dashboard Main -->
    <div class="col-md-9">
      <div class="card shadow">
        <div class="card-header bg-dark text-white">
          <h4>Billing Dashboard</h4>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead class="table-primary">
              <tr>
                <th>Consumer</th>
                <th>Units</th>
                <th>Category</th>
                <th>Base Amount</th>
                <th>Fixed Charge</th>
                <th>Tax</th>
                <th>Total Bill</th>
              </tr>
            </thead>
            <tbody id="billTable">
              <!-- Rows will be added dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function calculateBill() {
  let consumer = document.getElementById("consumerName").value;
  let units = parseFloat(document.getElementById("units").value);
  let tariff = document.getElementById("tariff").value;

  let rate, fixedCharge, taxRate = 0.12;

  if (tariff === "residential") { rate = 10; fixedCharge = 50; }
  else if (tariff === "commercial") { rate = 15; fixedCharge = 100; }
  else if (tariff === "industrial") { rate = 20; fixedCharge = 200; }

  let baseAmount = units * rate;
  let tax = baseAmount * taxRate;
  let total = baseAmount + fixedCharge + tax;

  // Add row to table
  let table = document.getElementById("billTable");
  let row = table.insertRow();
  row.innerHTML = `
    <td>${consumer}</td>
    <td>${units}</td>
    <td>${tariff}</td>
    <td>₱${baseAmount.toFixed(2)}</td>
    <td>₱${fixedCharge.toFixed(2)}</td>
    <td>₱${tax.toFixed(2)}</td>
    <td><strong>₱${total.toFixed(2)}</strong></td>
  `;

  // Reset form
  document.getElementById("billingForm").reset();
}
</script>

</body>
</html>
